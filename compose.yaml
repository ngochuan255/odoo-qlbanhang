name: odoo_thuchanh

services:
  db:
    image: postgres:16
    container_name: odoo_thuchanh_db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    image: odoo:20.0
    container_name: odoo_thuchanh_web
    depends_on:
      - db
    ports:
      - "8071:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo_data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
      - ./config:/etc/odoo
    restart: unless-stopped

volumes:
  postgres_data:
  odoo_data:
